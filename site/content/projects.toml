type = "research"
title = "Research"
description = "Connecting observational studies, forecasting and model evaluation through infectious disease and pediatric health data."

[[themes]]
id = "forecasting"
title = "Infectious disease forecasting"
question = "How reliable are forecasts across surveillance settings?"
overview = "The multi-country benchmark examines forecast accuracy and interval performance. The hospital study extends this work to local model adaptation and transfer across hospitals."

[[themes.works]]
publication_id = "cai2026tsfm"

[[themes.works]]
id = "residual-adaptation"
title = "Residual adaptation for pediatric hospital forecasting"
status = "Manuscript in preparation"
summary = "Studying local residual correction and interval estimation for frozen time series foundation models through retrospective evaluation of one-week-ahead forecasts."
contribution = "Compared forecast errors before and after local residual correction and evaluated prediction interval coverage and width."

[[themes]]
id = "vaccine-studies"
title = "Observational vaccine research"
question = "How do vaccination timing and population differences relate to disease risk?"
overview = "Linked surveillance and immunisation records from Chongqing support analyses of age at first vaccination, dosing intervals and sex differences in infant pertussis incidence."

[[themes.works]]
publication_id = "cai2026pertussis"

[[themes.works]]
id = "sex-differences"
title = "Sex differences in infant pertussis across vaccination stages"
status = "Manuscript in preparation"
summary = "Using time-updated vaccination stages and interaction analyses to examine how male–female incidence differences vary during follow-up, with sensitivity analyses of these observational associations."
contribution = "Allocated follow-up time by vaccination stage, estimated stage-specific male-to-female incidence rate ratios and tested the interaction between sex and stage."

[[themes]]
id = "pediatric-data"
title = "Multimodal and clinical pediatric data"
question = "How can different forms of pediatric clinical information be organised and evaluated?"
overview = "The thesis combines imaging and clinical records for pneumonia assessment. PedDialog examines the quality and training value of annotations in clinical conversations."

[[themes.works]]
id = "masters-thesis"
title = "Multimodal assessment of pediatric pneumonia"
status = "M.S. thesis · Ongoing"
summary = "The thesis aims to combine chest radiographs, blood counts and clinical histories for pneumonia detection and severity grading, with exploratory analysis of etiological classification. Pneumonia labels will be based on clinical diagnoses or guideline criteria."

[[themes.works]]
publication_id = "cai2026pedialog"
