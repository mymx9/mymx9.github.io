type = "research"
title = "Research"
description = "Connecting observational studies, forecasting and model evaluation through infectious disease and pediatric health data."

[[themes]]
id = "forecasting"
title = "Infectious disease forecasting"
question = "How reliable are forecasts across surveillance settings?"
overview = "My work connects benchmarking on multi-country surveillance data with adaptation to pediatric hospitals, focusing on forecast accuracy, prediction intervals and transfer across hospitals."

[[themes.works]]
publication_id = "cai2026tsfm"

[[themes.works]]
id = "residual-adaptation"
title = "Residual adaptation for pediatric hospital forecasting"
status = "Manuscript in preparation"
summary = "Studying local residual correction and interval estimation for frozen time series foundation models through retrospective evaluation of one-week-ahead forecasts."
contribution = "Led forecasting analyses and model evaluation."

[[themes]]
id = "vaccine-studies"
title = "Observational vaccine research"
question = "How do vaccination timing and population differences relate to disease risk?"
overview = "In collaboration with disease control authorities, I use linked immunisation and surveillance records to study infant pertussis, with an emphasis on vaccination timing, follow-up stages and population heterogeneity."

[[themes.works]]
publication_id = "cai2026pertussis"

[[themes.works]]
id = "sex-differences"
title = "Sex differences in infant pertussis across vaccination stages"
status = "Manuscript in preparation"
summary = "Using time-updated vaccination stages and interaction analyses to examine how male–female incidence differences vary during follow-up, with sensitivity analyses of these observational associations."
contribution = "Led statistical analyses, including time-updated stage modelling, interaction analyses and sensitivity analyses."

[[themes]]
id = "pediatric-data"
title = "Multimodal and clinical pediatric data"
question = "How can different forms of pediatric clinical information be organised and evaluated?"
overview = "I study the organisation, modelling and evaluation of pediatric imaging, laboratory results, clinical text and consultation dialogues."

[[themes.works]]
id = "masters-thesis"
title = "Multimodal assessment of pediatric pneumonia"
status = "M.S. thesis · Ongoing"
summary = "Plans to combine chest X-rays, laboratory data and clinical text for pneumonia detection, severity stratification and etiology classification, with evaluation of discrimination, calibration and robustness to missing modalities."

[[themes.works]]
publication_id = "cai2026pedialog"
