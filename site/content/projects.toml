type = "card"
title = "Research"
description = "Selected research projects, data products, and applied work."

[[items]]
title = "Pediatric Pneumonia Multimodal Cascade — M.S. Thesis"
subtitle = "PediatriXlab, Children's Hospital of Chongqing Medical University"
date = "2025–ongoing"
content = "A clinically aligned three-stage multimodal cascade for pediatric pneumonia assessment — detection, severity triage, and etiology classification — built on CHCMU pediatric chest X-rays, radiology findings, and structured clinical data, with multimodal fusion, Grad-CAM interpretability, ROC evaluation, and matched ablations. Thesis and manuscript in preparation."

[[items]]
title = "Controllable Chest X-ray Synthesis for Pediatric Data"
subtitle = "PediatriXlab (GPU cluster)"
date = "2026–ongoing"
content = "Transferring RoentGen-v2 (finely-controllable latent diffusion for radiographs) to in-house pediatric chest X-rays via LoRA adaptation with a clinic-token conditioning branch and image-grounded losses; targets controllable synthesis of rare-condition samples to complement downstream clinical models."

[[items]]
title = "Pertussis Vaccination Timing and Safety — Chongqing Birth Cohort"
subtitle = "PediatriXlab, Children's Hospital of Chongqing Medical University"
date = "2024–2026"
content = "Linked immunisation, surveillance and AEFI records in a retrospective Chongqing birth cohort of 76,844 eligible infants, including 69,612 in the effectiveness comparison. Compared post-vaccination incidence and safety by initiation age and evaluated interval timeliness; no significant incidence difference was observed between initiation groups, while timely intervals were associated with lower risk. **Output:** joint first-author paper published in *BMC Public Health* on 6 April 2026; [DOI](https://doi.org/10.1186/s12889-026-27239-x)."

[[items]]
title = "Benchmarking Time-Series Foundation Models for Infectious Disease Surveillance"
subtitle = "PediatriXlab"
date = "2025–2026"
content = "Assembled 289 disease-country series across 70+ diseases and six countries (106,234 weekly or monthly observations). Compared four zero-shot TSFM families with five neural baselines and naive/seasonal naive references across one-step, medium- and long-term horizons, assessing point forecasts and Moirai prediction intervals. Findings are limited to one held-out year per series. **Output:** joint first-author paper published online in *BMC Public Health* on 14 October 2026 (Article in Press); [DOI](https://doi.org/10.1186/s12889-026-29918-1)."

[[items]]
title = "Multicentre Respiratory Outpatient Forecasting — Six Chinese Hospitals"
subtitle = "PediatriXlab"
date = "2025–ongoing"
content = "Weekly outpatient visits for 3 respiratory conditions across six hospitals; a disease-specific TSFM-persistence hybrid compared with clinically interpretable baselines using repeated rolling-origin validation and clinical outcome metrics. Co-first author; manuscript in preparation (working title)."

[[items]]
title = "PedDialog — Pediatric Consultation Dialogue Dataset"
subtitle = "PediatriXlab"
date = "2025–2026"
content = "Joint first author. Under review at Scientific Data. Multi-turn pediatrician-caregiver consultations, cleaned and de-identified through a multi-stage process. Each physician response is paired with LLM-generated reasoning reviewed by pediatricians, with human-verified English translations. Annotations explain plausible clinical rationales rather than physicians' actual internal thought processes."

[[items]]
title = "Synthetic Tabular Data Generation and Evaluation — Pediatric Records"
subtitle = "PediatriXlab"
date = "2026–ongoing"
content = "Benchmarked SDV-family generative models (copula, CTGAN, TVAE, TabDDPM) with grouped/constrained structures, evaluated via similarity (UMAP), machine-learning utility (hospitalization/ICU prediction), privacy metrics, and ablation studies. Co-first author; manuscript in preparation."

[[items]]
title = "Sex Differences in Pertussis Risk Trajectory — Birth Cohort"
subtitle = "PediatriXlab"
date = "2026–ongoing"
content = "Follow-up analysis of the Chongqing birth cohort using a target-trial framework to characterize sex differences in pertussis risk across the primary immunization series. Co-first author; manuscript in preparation."

[[items]]
title = "Commercial Vehicle Auto Insurance Risk Monitoring"
subtitle = "Ping An Property & Casualty Insurance, Chongqing Branch (Data Analyst)"
date = "2021–2024"
content = "Citywide risk monitoring and analysis for commercial vehicle auto insurance; built and maintained the branch data analysis platform."

[[items]]
title = "Air Pollution and the Demand for Commercial Health Insurance"
subtitle = "Chongqing University — undergraduate thesis"
date = "2021"
content = "Empirical study of how air pollution affects household demand for commercial health insurance, using econometric models with provincial panel data."

[[items]]
title = "MCM/ICM 2019 Problem D — Drone-Based Disaster Relief System"
subtitle = "Mathematical Contest in Modeling"
date = "2019"
content = "Designed a drone-based disaster relief response system for hurricane-affected Puerto Rico with integer programming, entropy weighting, and fuzzy synthetic decision analysis. Awarded **Meritorious Winner**."
