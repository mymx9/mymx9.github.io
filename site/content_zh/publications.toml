[entries.cai2026tsfm]
research_title = "多国传染病时序基础模型基准"
summary = "比较零样本时序基础模型与神经网络基线在不同预测时长下的点预测误差，并评价预测区间。"
contribution = "与 Guoyu Huang 共同收集并分析六国 70 余种传染病的 289 条监测序列。将各序列最后一年留作测试，比较四类零样本基础模型与五种神经网络基线。在按国家、预测时长和误差指标划分的 36 项比较中，基础模型在 30 项取得最低观测误差。"

[entries.cai2026pertussis]
research_title = "百日咳疫苗接种时序与安全性"
summary = "利用重庆出生队列比较 2 月龄与 3 月龄启动接种婴儿的百日咳发病率，另行考察剂次间隔与发病率的关联。"
contribution = "分析重庆市疾控部门提供的出生队列资料，关联覆盖全市的疫智防控系统、免疫接种与预防接种不良事件监测记录。76,844 名符合条件的婴儿中，69,612 名进入有效性分析。按接种阶段划分随访人时，通过 Poisson 回归比较两组发病率，另行分析剂次间隔与发病率的关联。"

[entries.cai2026pedialog]
research_title = "PedDialog：儿科问诊对话数据集"
summary = "整理照护者与儿科医生的多轮问诊对话，为每条医生回复配对由模型生成、经儿科医生审核的推理标注。"
contribution = "参与整理儿童医院互联网医院的照护者与儿科医生问诊记录，评价去标识化完整性和标注质量。通过监督微调消融实验，比较使用和不使用推理标注时的模型表现。"
