type = "card"
title = "研究"
description = "参与的研究课题、数据产品与应用项目。"

[[items]]
title = "Pediatric Pneumonia Multimodal Cascade — 硕士学位论文"
subtitle = "PediatriXlab、重庆医科大学附属儿童医院儿童医学大数据中心"
date = "2025–在研"
content = "儿童肺炎的临床对齐三阶段多模态级联：检测—严重度分诊—病因分类，基于 CHCMU 儿科胸片、放射报告与结构化临床数据，采用多模态融合、Grad-CAM 可解释性、ROC 评价与匹配消融。学位论文与论文稿在研。"

[[items]]
title = "Controllable Chest X-ray Synthesis — 儿科胸片可控合成"
subtitle = "PediatriXlab（GPU 集群）"
date = "2026–在研"
content = "将 RoentGen-v2（面向放射影像的精细可控潜在扩散模型）迁移至医院自有儿科胸片数据：LoRA 微调 + 临床标签 token 条件分支 + 图像对齐损失，面向稀有病种样本的可控合成，服务下游临床模型。"

[[items]]
title = "Pertussis Vaccination Timing and Safety — 重庆出生队列"
subtitle = "PediatriXlab、重庆医科大学附属儿童医院儿童医学大数据中心"
date = "2024–2026"
content = "基于免疫、发病与 AEFI 数据链接的重庆回顾性出生队列，纳入 76,844 名符合条件婴儿，有效性比较包含 69,612 名。比较 2 与 3 月龄启动的接种后发病率与安全性，并评估接种间隔及时性；未观察到启动组间发病率的显著差异，准时间隔与较低风险相关。**产出：** 共同第一作者论文，发表于 *BMC Public Health*（2026-04-06），[DOI](https://doi.org/10.1186/s12889-026-27239-x)。"

[[items]]
title = "Benchmarking Time-Series Foundation Models — 多国传染病监测"
subtitle = "PediatriXlab"
date = "2025–2026"
content = "构建 6 国、70 余病种的 289 个疾病-国家序列（106,234 条周度或月度观测），比较 4 类零样本 TSFM、5 个神经网络基线及朴素/季节朴素参考模型，覆盖单步、中期与长期预测。评价点预测误差及 Moirai 区间预测；结论限于每序列一个留出年的测试期。**产出：** 共同第一作者论文，2026-10-14 在线发表于 *BMC Public Health*（Article in Press），[DOI](https://doi.org/10.1186/s12889-026-29918-1)。"

[[items]]
title = "Frozen TSFM Residual Adaptation — 儿童医院呼吸道预测"
subtitle = "PediatriXlab"
date = "2025–在研"
content = "共同第一作者，稿件在研。研究儿童医院呼吸道感染的单周前瞻预测，在冻结 Chronos-2 与 Moirai-2 权重的基础上，使用共享 LightGBM 残差适配器修正点预测，并以高斯过程估计误差尺度、构建预测区间。比较有无天气与节假日协变量的配置及常规预测基线，结合匹配消融、留一城市验证和覆盖率、区间宽度与加权区间评分，评价适配效果、跨院迁移与局部失效。研究属于回顾性预测评价；医院记录病例数不等于人群发病率，留一城市验证仍处于同一评价时段，尚不能推断临床效益或支持自动校正策略。"

[[items]]
title = "PedDialog — 儿科问诊对话数据集"
subtitle = "PediatriXlab"
date = "2025–2026"
content = "共同第一作者。Scientific Data 审稿中。儿科医生与照护者的多轮问诊对话数据集，经过清洗与多阶段去标识化；每条医生回复配有语言模型生成、儿科医生审核的推理标注，并提供经人工核验的英文译文。标注解释回复的临床依据，不代表医生真实的内部思维过程。"

[[items]]
title = "Synthetic Tabular Data — 儿科数据合成与评估"
subtitle = "PediatriXlab"
date = "2026–在研"
content = "基于 SDV 框架（copula、CTGAN、TVAE、TabDDPM）分组约束生成与评估：相似性（UMAP）、机器学习效用（住院/ICU 预测任务）、隐私评估与消融分析。共同第一作者，论文在研。"

[[items]]
title = "Sex Differences in Infant Pertussis — 基础免疫阶段队列研究"
subtitle = "PediatriXlab"
date = "2026–在研"
content = "共同第一作者，稿件在研。链接重庆免疫登记与百日咳监测资料，将婴儿自出生起的人时按接种阶段动态划分，并设置接种后免疫形成滞后。采用拟泊松回归与婴儿层面聚类稳健标准误，调整年龄、日历月、地区和首剂疫苗产品，通过性别×接种阶段交互检验、阶段特异发病率比及比值之比刻画男女差异。敏感性分析涵盖不同接种后滞后、地区调整、住院诊断结局和入组条件。研究描述阶段特异的性别差异，不能分离接种与年龄成熟效应，也不估计疫苗有效性或证明后期男女等效。"

[[items]]
title = "Commercial Vehicle Auto Insurance Risk Monitoring — 车险风险监控"
subtitle = "中国平安财产保险重庆分公司（数据分析岗）"
date = "2021–2024"
content = "负责全市商用车车险风险监控分析，参与分公司数据分析平台建设（含发版、版本控制权限）。"

[[items]]
title = "空气污染对商业健康险需求的影响研究"
subtitle = "重庆大学本科毕业论文"
date = "2021"
content = "基于省级面板数据的计量分析，研究空气污染对居民商业健康险需求的影响。指导教师：段正敏 副教授。"

[[items]]
title = "MCM/ICM 2019 Problem D — 无人机灾后救援系统"
subtitle = "Mathematical Contest in Modeling"
date = "2019"
content = "为受飓风影响的波多黎各设计无人机灾后救援系统：整数规划选址、熵权法与模糊综合决策。获 **Meritorious Winner（一等奖）**。"
